[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai"
version = "0.1.0"
description = "Enterprise AI Knowledge and Decision Intelligence Platform"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pandas",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]